<script>
const CH = [
{t:`Introducción`, p:[
`Hola. En esta explicación vamos a repasar juntos todo el tema. Primero, la crisis de España en el siglo diecisiete. Después, el Barroco como movimiento literario. Y, por último, los dos grandes poetas de la época: Francisco de Quevedo y Luis de Góngora.`,
`Escucha con calma. Puedes pausar cuando quieras, repetir un apartado o tocar una frase para volver a escucharla. Empezamos.`]},

{t:`La crisis general de España`, p:[
`Durante el siglo diecisiete, España vivió una profunda decadencia. Fue una crisis económica, demográfica y política, es decir, afectó al dinero, a la población y al gobierno. Como consecuencia, España perdió su hegemonía en Europa, o sea, dejó de ser la potencia dominante.`,
`¿Por qué ocurrió? Hay tres causas principales. La primera, las continuas guerras en el extranjero, que costaban muchísimo dinero y muchas vidas. La segunda, las revueltas y los conflictos internos dentro de la propia monarquía. Y la tercera, el final de la dinastía de los Austrias, que se extinguió al terminar el siglo.`,
`Recuerda esta idea clave: el siglo diecisiete es, para España, el siglo de la decadencia.`]},

{t:`Felipe III y el duque de Lerma`, p:[
`Los reyes de este siglo se conocen como los Austrias menores, para distinguirlos de los Austrias mayores del siglo dieciséis, que fueron Carlos Primero y Felipe Segundo. Los Austrias menores son tres: Felipe Tercero, Felipe Cuarto y Carlos Segundo.`,
`Un rasgo común de sus reinados es el gobierno de los validos. Un valido era un hombre de confianza del rey, un favorito, al que el monarca entregaba el poder real del gobierno.`,
`Empecemos por Felipe Tercero, que reinó de 1598 a 1621. Felipe Tercero dejó el poder en manos de su valido, el duque de Lerma. El rey se desinteresó de la política y se dedicó sobre todo a la religión y a las diversiones.`,
`¿Cuál fue el gran problema de este reinado? La venta de cargos públicos. Los puestos de la administración se compraban con dinero, y eso provocó corrupción y una crisis moral. En política exterior, España no perdió territorios durante su reinado, pero sí perdió fuerza y prestigio internacional.`]},

{t:`Felipe IV y el conde-duque de Olivares`, p:[
`El siguiente rey fue Felipe Cuarto, que reinó de 1621 a 1665. Su valido fue el conde-duque de Olivares, un hombre ambicioso y autoritario. Olivares quería recuperar la grandeza de España, pero muchas de sus decisiones tuvieron consecuencias negativas.`,
`Veamos primero las guerras. Se reanudó la guerra en los Países Bajos. En 1625 se produjo la rendición de Breda ante las tropas españolas, una victoria famosa que Velázquez pintó en el cuadro Las lanzas. Sin embargo, a largo plazo, España terminó perdiendo los Países Bajos del norte, que fueron reconocidos como independientes en 1648.`,
`También hubo guerra contra Francia. Este conflicto terminó con la Paz de los Pirineos, en 1659, por la que España cedió varios territorios a Francia.`,
`Ahora, la crisis interna. Para pagar tantas guerras aumentaron los impuestos, y eso provocó revueltas. En 1640 ocurrieron dos hechos muy graves: Portugal se sublevó y se separó de España, y estalló el grave conflicto de Cataluña.`,
`En los últimos años del reinado, Olivares fue sustituido por un nuevo valido, don Luis de Haro, pero la crisis interna continuó.`]},

{t:`Carlos II, el Hechizado`, p:[
`El último de los Austrias fue Carlos Segundo, que reinó de 1665 a 1700. Lo llamaban el Hechizado. ¿Por qué? Porque era físicamente muy débil y enfermizo, y en la época se creía que había sido víctima de un hechizo. Como su padre y su abuelo, delegó el poder en validos, que en su caso fueron corruptos.`,
`En política exterior, luchó en tres guerras consecutivas contra la poderosa Francia de Luis Catorce, y España perdió más territorios.`,
`El gran problema final fue la crisis sucesoria. Carlos Segundo murió sin herederos. En su testamento nombró sucesor a un príncipe francés: Felipe de Anjou, nieto de Luis Catorce. Con la muerte de Carlos Segundo, en 1700, se extinguió la dinastía de los Austrias en España.`,
`Un consejo para memorizar: Felipe Tercero va con Lerma. Felipe Cuarto va con Olivares. Y Carlos Segundo es el Hechizado, el último Austria.`]},

{t:`Economía, población y sociedad`, p:[
`Pasamos ahora a la situación económica, demográfica y social. ¿Cuáles fueron las causas de la crisis económica y demográfica? Son varias.`,
`Primero, los enormes gastos de las guerras. Segundo, llegaba menos plata y menos metales preciosos de América. Esto se debía a los ataques de piratas y corsarios contra los barcos, y a la falta de mano de obra en las minas. Tercero, las epidemias y el clima adverso, con sequías e inundaciones que destruían las cosechas.`,
`Cuarto, las quiebras del Estado. La Corona se declaró en bancarrota varias veces, por ejemplo en 1607 y en 1627, porque no podía pagar sus deudas. Quinto, la expulsión de los moriscos en 1609. Los moriscos eran los descendientes de los musulmanes convertidos al cristianismo. Su expulsión perjudicó gravemente a la agricultura, porque eran una mano de obra experta y barata.`,
`Y sexto, el descenso de la población. España pasó de unos diez millones de habitantes a finales del siglo dieciséis a menos de ocho millones a mediados del diecisiete.`,
`Veamos ahora la sociedad y la mentalidad. En España faltaba una burguesía fuerte. El comercio y el trabajo manual estaban mal vistos, y la burguesía perdió influencia. Al mismo tiempo, aumentaron la nobleza y el clero, porque el Estado vendía títulos para conseguir dinero. Estos grupos poseían tierras poco productivas, vivían con lujo y no pagaban impuestos.`,
`La pobreza se extendió. Aumentaron los mendigos, los vagabundos, llamados pícaros, los ladrones y el bandolerismo en las grandes ciudades.`,
`Finalmente, España vivió un aislamiento cultural. La Inquisición mantuvo el control ideológico y defendió el ideal de la limpieza de sangre, es decir, no tener antepasados judíos ni musulmanes. Todo esto alejó a España de la revolución científica y del racionalismo que se desarrollaban en el resto de Europa.`]},

{t:`Del Renacimiento al Barroco`, p:[
`Ahora entramos en la literatura. El Barroco se desarrolló en el siglo diecisiete, en España y en Europa. Nació en un contexto de decadencia, de crisis social y de tensiones religiosas, justo lo que acabamos de estudiar.`,
`Fíjate en el cambio respecto al Renacimiento. El Renacimiento creía en la armonía, en el equilibrio y en la belleza ideal del mundo. En el Barroco, esa armonía se desmorona y aparece una visión negativa, pesimista y desengañada de la vida.`,
`La palabra clave del Barroco es desengaño. El desengaño es la toma de conciencia de que las cosas terrenales son vanas, es decir, no tienen verdadero valor. Supone el fin de las ilusiones. Por eso se dice que pasamos del idealismo renacentista al desengaño barroco.`]},

{t:`Características del Barroco`, p:[
`Veamos las características principales del Barroco. Son seis.`,
`Primera: la búsqueda de la originalidad. A pesar de la censura política y religiosa, los escritores quieren sorprender al lector. Para ello usan un estilo muy elaborado y, a veces, oscuro y difícil.`,
`Segunda: el desequilibrio y la desmesura. Desaparece el equilibrio clásico. Se da importancia a la realidad cruda, a los contrastes y a las antítesis, es decir, a la oposición de ideas contrarias.`,
`Tercera: la condición humana y la aspiración al infinito. En el ser humano barroco conviven dos actitudes: el apego a los bienes terrenales y, a la vez, la conciencia de que esos bienes son pasajeros. Esta conciencia puede llevar a la ascética y a la espiritualidad.`,
`Cuarta: el dinamismo y la fugacidad. Las obras transmiten sensación de movimiento para expresar lo rápido que pasa el tiempo.`,
`Quinta: la belleza y la fealdad. Junto a la belleza decorativa, también se valoran lo feo, lo deforme y lo grotesco.`,
`Y sexta: la imitación y superación de los clásicos. Los autores barrocos imitan los modelos renacentistas y clásicos, pero intentan superarlos, muchas veces a través de la ironía y la parodia.`]},

{t:`Los géneros literarios`, p:[
`El Barroco cultivó los tres grandes géneros. En poesía hay dos corrientes: el culteranismo, con Luis de Góngora, y el conceptismo, con Francisco de Quevedo.`,
`En prosa destacan dos tipos de obras. Por un lado, la novela picaresca, como El Buscón, de Quevedo. Por otro, la prosa didáctica, como El Criticón, de Baltasar Gracián.`,
`Y en teatro, los grandes autores son tres: Lope de Vega, con Fuenteovejuna; Calderón de la Barca, con La vida es sueño; y Tirso de Molina, con El burlador de Sevilla.`]},

{t:`Culteranismo y conceptismo`, p:[
`Ahora, una de las partes más importantes del tema: las dos corrientes de la poesía barroca. Las dos buscan el artificio y la sorpresa, pero de maneras distintas.`,
`Empezamos por el culteranismo, también llamado gongorismo, por Góngora. El culteranismo da prioridad a la forma. Su objetivo es crear belleza visual y musical mediante un lenguaje culto y elaborado.`,
`Sus recursos principales son estos. Los cultismos, que son palabras tomadas del latín o del griego. Los hipérbatos, que alteran el orden normal de las palabras en la frase. Las metáforas audaces. Las perífrasis, que dicen algo de forma indirecta, con más palabras. Las sinestesias, que mezclan sensaciones de distintos sentidos. Y muchas referencias a la luz, el color y el sonido. Su principal representante es Luis de Góngora.`,
`Ahora el conceptismo. El conceptismo da prioridad al contenido, al concepto, a la idea. Su objetivo es estimular la inteligencia y el ingenio, relacionando ideas distintas de forma inesperada.`,
`Sus recursos son los dobles sentidos, los juegos de palabras, las antítesis, las paradojas y la condensación del significado, es decir, decir mucho con pocas palabras. Su principal representante es Francisco de Quevedo.`,
`Un truco para recordarlo: culteranismo es forma, o sea, cómo se dice. Conceptismo es concepto, o sea, qué se dice.`]},

{t:`Los temas de la poesía barroca`, p:[
`Pasamos a los temas principales de la poesía barroca. Son seis.`,
`Primero, el amor. Continúa la tradición petrarquista y neoplatónica del Renacimiento, pero también se trata con sátira o parodia.`,
`Segundo, la naturaleza, que se describe con detalle, con realismo y con colores vivos.`,
`Tercero, la mitología. Por un lado, se celebran con solemnidad los modelos clásicos. Por otro, se reinterpretan de forma satírica o grotesca.`,
`Cuarto, la muerte y el paso del tiempo. La vida terrenal es efímera, es decir, dura muy poco. Por eso aparecen símbolos como los relojes, las flores marchitas y las calaveras.`,
`Quinto, el desengaño, que es el tema central. Se critican las apariencias engañosas, las riquezas, el lujo y la ambición de poder.`,
`Y sexto, la religión. Los poetas reflexionan sobre los conflictos del alma, el arrepentimiento, el pecado y la gracia divina.`]},

{t:`Quevedo: vida y personalidad`, p:[
`Ahora conocemos al primero de nuestros grandes autores: Francisco de Quevedo y Villegas, que vivió de 1580 a 1645.`,
`Quevedo nació en Madrid, en una familia aristocrática vinculada a la corte. Desde joven mostró gran talento y una enorme cultura. Estudió y trabajó en la política y en la diplomacia. Estuvo al servicio del duque de Osuna, pero, cuando el duque cayó en desgracia, Quevedo fue apartado de la corte.`,
`En 1621 volvió a Madrid y apoyó las ideas reformistas del conde-duque de Olivares. Pero más tarde se convirtió en su adversario y lo criticó con sátiras. Por eso, en 1639, fue encarcelado en León. Pasó sus últimos años enfermo y con dificultades económicas, y murió en 1645.`,
`Su personalidad refleja las contradicciones de la España barroca. Quería obtener títulos nobiliarios, pero a veces criticaba a la aristocracia. Defendía en sus obras el valor burgués de la virtud, pero no siempre seguía esos principios en su vida. Era muy inteligente y famoso por su ingenio y sus ocurrencias, pero también tenía un carácter introvertido y difícil. Y, además, fue un gran rival de Góngora.`]},

{t:`Quevedo: estilo y poesía`, p:[
`Quevedo escribió muchísimas obras, en prosa y en verso. Es el máximo representante del conceptismo y uno de los grandes maestros de la lengua española.`,
`Su estilo se caracteriza por la densidad. Usa juegos de palabras, comparaciones insólitas, antítesis y contrastes, con los que consigue efectos sorprendentes. Además, expresó como pocos el gran tema barroco del desengaño: la desilusión ante la vida y ante las apariencias.`,
`Su obra incluye poesía, como sus sonetos; la novela picaresca El Buscón; y obras satírico-morales como los Sueños y La hora de todos y la Fortuna con seso.`,
`En poesía, Quevedo dominó muchas formas métricas, pero predominan los sonetos. Su poesía se divide en cinco tipos.`,
`La poesía amorosa retoma la tradición petrarquista y neoplatónica. Presenta el amor como una fuerza capaz de vencer a la muerte, pero también como causa de sufrimiento.`,
`La poesía filosófica y moral reflexiona sobre la brevedad de la vida, la muerte y el paso del tiempo, y critica la decadencia de las costumbres castellanas.`,
`La poesía religiosa trata el arrepentimiento, la fugacidad de lo terrenal, la relación con Dios, la muerte y las debilidades humanas.`,
`La poesía política muestra su preocupación por la decadencia del Imperio.`,
`Y la poesía satírico-burlesca muestra su enorme ingenio. Quevedo usa la burla también para desahogar el dolor que le causa el desengaño.`]},

{t:`Quevedo: la prosa y El Buscón`, p:[
`Vamos con la prosa de Quevedo. Primero, las obras satírico-morales. Los Sueños, de 1627, son cinco narraciones breves en las que Quevedo critica y ridiculiza los vicios y los oficios de la sociedad de su tiempo. En La hora de todos y la Fortuna con seso, de 1641, la diosa Fortuna da a cada persona lo que realmente merece. Así se muestra un mundo al revés.`,
`Ahora, su novela picaresca: La vida del Buscón, publicada en 1626. El protagonista, Pablos, cuenta su vida en primera persona. Es hijo de un barbero ladrón y de una madre que se dedica a la brujería. A lo largo de la novela intenta ascender socialmente, pero fracasa una y otra vez.`,
`El Buscón se inspira en el Lazarillo de Tormes y en el Guzmán de Alfarache, pero destaca por su virtuosismo lingüístico.`,
`Sus características principales son cinco. Uno: el ingenio y la brillantez del lenguaje, refinado, elaborado y lleno de figuras retóricas. Dos: la exageración y la deformación grotesca. Quevedo lleva las situaciones al extremo hasta hacerlas irreales, y así se aleja del realismo típico de la picaresca clásica.`,
`Tres: el tratamiento caricaturesco. Los personajes parecen marionetas, sin afecto ni dignidad; son caricaturas. Cuatro: la ausencia de intención moralizadora. El objetivo de Quevedo es sobre todo estético y satírico, no enseñar una moral.`,
`Y cinco: la ideología. Quevedo se opone a la movilidad social y defiende una división rígida de las clases. Por eso Pablos nunca consigue subir de clase: para Quevedo, cada uno debe quedarse en su lugar.`]},

{t:`Góngora: vida`, p:[
`Llegamos al segundo gran poeta: Luis de Góngora, que nació en Córdoba en 1561 y murió allí mismo en 1627.`,
`Nació en una familia acomodada y culta. Fue destinado a la carrera eclesiástica, aunque él prefería una vida mundana y despreocupada. Estudió Derecho en Salamanca, donde empezó a escribir poesía y se hizo famoso muy pronto.`,
`En 1617, gracias a su protector, el duque de Lerma, fue nombrado capellán real. Se ordenó sacerdote y se instaló en Madrid, donde llegó a ser considerado el mejor poeta de su tiempo.`,
`Pero después llegó la decadencia. Sus protectores cayeron, y además tenía afición al juego, así que sufrió graves problemas económicos. Enfermo, volvió a Córdoba en 1626 y murió al año siguiente.`,
`La posteridad lo recuerda como un hombre severo, sombrío y orgulloso. Tuvo célebres rivalidades personales y literarias con Francisco de Quevedo y con Lope de Vega.`]},

{t:`Góngora: obra`, p:[
`Aparte de dos comedias poco relevantes, la obra de Góngora es exclusivamente lírica, es decir, poesía, y de tema profano, o sea, no religioso.`,
`Se distinguen dos etapas. Antes de 1610, sus rasgos culteranos son menos marcados. Después de 1610, crea un lenguaje poético nuevo, acumulando e intensificando recursos retóricos complejos.`,
`Su obra se divide en dos grandes grupos. El primero es la poesía popular, en versos de arte menor. Incluye romances y letrillas que tuvieron mucho éxito. Se inspiran en la tradición popular, pero se nota la elaboración culta del poeta. Algunas tienen un tono serio y grave; otras, humorístico o satírico. Un ejemplo es la letrilla Ándeme yo caliente y ríase la gente.`,
`El segundo grupo es la poesía culta, en versos de arte mayor. Aquí están, primero, los sonetos, que siguen el modelo clásico y tratan varios temas. Los amorosos muestran la influencia de Petrarca. Los satíricos usan un léxico coloquial e incluso vulgar. Los morales expresan las inquietudes personales del poeta, con un tono serio o burlón. Los mitológicos tienen intención burlesca y presentan a los dioses del Olimpo como seres humanos.`,
`También hay sonetos en espiral, difíciles de leer porque no tienen pausas fuertes y están llenos de metáforas, paralelismos y correlaciones.`,
`Y, por último, los poemas mayores, que son la cumbre del culteranismo. Destacan la Fábula de Polifemo y Galatea, de 1612, y las Soledades, de 1613. Son obras pensadas como un reto para la inteligencia, y resultan difíciles para el lector poco culto. Se caracterizan por los cultismos, los latinismos, los hipérbatos complejos y las metáforas audaces, además de una gran atención a los colores, la luz y la musicalidad.`]},

{t:`Repaso final`, p:[
`Para terminar, hagamos un repaso rápido.`,
`El siglo diecisiete fue para España un siglo de crisis: guerras, revueltas, quiebras del Estado, epidemias, expulsión de los moriscos y pérdida de población. Gobernaron los Austrias menores con sus validos: Felipe Tercero con el duque de Lerma, Felipe Cuarto con el conde-duque de Olivares, y Carlos Segundo, el Hechizado, con quien terminó la dinastía.`,
`En literatura, esta crisis produjo el Barroco, cuya palabra clave es el desengaño. En poesía hay dos corrientes: el culteranismo de Góngora, que da prioridad a la forma, y el conceptismo de Quevedo, que da prioridad al concepto.`,
`Quevedo es el maestro del ingenio, de la sátira y del desengaño, y el autor de El Buscón. Góngora es el maestro de la belleza formal, autor del Polifemo y de las Soledades.`,
`Y con esto terminamos. ¡Mucho ánimo con el estudio!`]}
];

/* ---------- build the page ---------- */
const textEl = document.getElementById('text');
const tocEl = document.getElementById('toc');
const SENT = [];      // SENT[ci] = [{el,text}]
const tocBtns = [];
const splitSentences = s => (s.match(/[^.!?…]+[.!?…]+\s*|[^.!?…]+$/g) || [s]).map(x => x.trim()).filter(Boolean);

CH.forEach((c, ci) => {
  const sec = document.createElement('section');
  sec.className = 'ch'; sec.id = 'ch-' + ci;
  const h = document.createElement('h2');
  h.innerHTML = `<span class="n">${ci + 1}</span><span></span>`;
  h.lastChild.textContent = c.t;
  sec.appendChild(h);
  SENT[ci] = [];
  c.p.forEach(par => {
    const p = document.createElement('p');
    splitSentences(par).forEach(txt => {
      const span = document.createElement('span');
      span.className = 's'; span.textContent = txt;
      const si = SENT[ci].length;
      span.addEventListener('click', () => { ci_ = ci; si_ = si; play(); });
      p.appendChild(span); p.appendChild(document.createTextNode(' '));
      SENT[ci].push({ el: span, text: txt });
    });
    sec.appendChild(p);
  });
  textEl.appendChild(sec);

  const li = document.createElement('li');
  const b = document.createElement('button');
  b.textContent = (ci + 1) + '. ' + c.t;
  b.addEventListener('click', () => { ci_ = ci; si_ = 0; playing ? speakCurrent() : (mark(true), save()); });
  li.appendChild(b); tocEl.appendChild(li); tocBtns.push(b);
});
const TOTAL = SENT.reduce((a, s) => a + s.length, 0);
if (window.matchMedia('(max-width:860px)').matches) document.getElementById('tocBox').open = false;

/* ---------- speech ---------- */
const synth = window.speechSynthesis;
const statusEl = document.getElementById('status');
const playBtn = document.getElementById('play');
const rateSel = document.getElementById('rate');
const voiceSel = document.getElementById('voice');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let ci_ = 0, si_ = 0, playing = false, gen = 0, voices = [], voice = null;

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { store('barroco-pos', { ci: ci_, si: si_ }); }

const pos = load('barroco-pos');
if (pos && SENT[pos.ci] && SENT[pos.ci][pos.si]) { ci_ = pos.ci; si_ = pos.si; }
const savedRate = load('barroco-rate');
if (savedRate) rateSel.value = String(savedRate);

function mark(scroll) {
  document.querySelectorAll('.s.now').forEach(e => e.classList.remove('now'));
  const cur = SENT[ci_][si_];
  cur.el.classList.add('now');
  if (scroll) cur.el.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
  tocBtns.forEach((b, i) => b.setAttribute('aria-current', i === ci_ ? 'true' : 'false'));
  document.getElementById('where').textContent = `Apartado ${ci_ + 1} de ${CH.length}`;
  document.getElementById('ptitle').textContent = CH[ci_].t;
  let done = 0; for (let i = 0; i < ci_; i++) done += SENT[i].length; done += si_;
  document.getElementById('bar').style.width = (done / TOTAL * 100) + '%';
}

function setPlayingUI(on) {
  document.getElementById('icoPlay').style.display = on ? 'none' : '';
  document.getElementById('icoPause').style.display = on ? '' : 'none';
  playBtn.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
}

function speakCurrent() {
  const my = ++gen;
  synth.cancel();
  mark(true); save();
  const u = new SpeechSynthesisUtterance(SENT[ci_][si_].text);
  u.lang = voice ? voice.lang : 'es-ES';
  if (voice) u.voice = voice;
  u.rate = parseFloat(rateSel.value);
  u.onend = () => { if (my === gen && playing) advance(); };
  u.onerror = e => {
    if (my !== gen || e.error === 'interrupted' || e.error === 'canceled') return;
    if (e.error === 'not-allowed') { stop(); statusEl.textContent = 'El navegador ha bloqueado el audio. Pulsa de nuevo el botón para reproducir.'; return; }
    if (playing) advance();
  };
  setTimeout(() => { if (my === gen) synth.speak(u); }, 60);
}

function advance() {
  si_++;
  if (si_ >= SENT[ci_].length) {
    ci_++; si_ = 0;
    if (ci_ >= CH.length) { ci_ = 0; si_ = 0; stop(); mark(false); save(); statusEl.textContent = 'Has llegado al final. Pulsa el botón para escucharlo otra vez desde el principio.'; return; }
  }
  speakCurrent();
}

function play() { if (!synth) return; playing = true; setPlayingUI(true); speakCurrent(); }
function stop() { playing = false; gen++; if (synth) synth.cancel(); setPlayingUI(false); }

playBtn.addEventListener('click', () => playing ? stop() : play());
document.getElementById('prev').addEventListener('click', () => {
  ci_ = (si_ > 0) ? ci_ : Math.max(0, ci_ - 1); si_ = 0;
  playing ? speakCurrent() : (mark(true), save());
});
document.getElementById('next').addEventListener('click', () => {
  if (ci_ < CH.length - 1) { ci_++; si_ = 0; }
  playing ? speakCurrent() : (mark(true), save());
});
rateSel.addEventListener('change', () => { store('barroco-rate', parseFloat(rateSel.value)); if (playing) speakCurrent(); });
voiceSel.addEventListener('change', () => {
  voice = voices.find(v => v.name === voiceSel.value) || null;
  store('barroco-voice', voiceSel.value);
  if (playing) speakCurrent();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/^(SELECT|BUTTON|INPUT|SUMMARY)$/.test(e.target.tagName)) { e.preventDefault(); playing ? stop() : play(); }
});

function scoreVoice(v) {
  let s = 0;
  if (/^es[-_]ES/i.test(v.lang)) s += 4; else if (/^es/i.test(v.lang)) s += 2;
  if (/natural|neural|online|premium|enhanced|mejorad/i.test(v.name)) s += 3;
  if (/google|m[oó]nica|jorge|luc[ií]a|elvira|[aá]lvaro|paulina|marisol/i.test(v.name)) s += 2;
  return s;
}

function loadVoices() {
  const all = synth.getVoices();
  if (!all.length) return;
  voices = all.filter(v => /^es/i.test(v.lang)).sort((a, b) => scoreVoice(b) - scoreVoice(a));
  voiceSel.innerHTML = '';
  if (!voices.length) {
    voiceSel.innerHTML = '<option value="">Predeterminada</option>';
    voice = null;
    statusEl.className = 'status warn';
    statusEl.textContent = 'No encuentro una voz en español en este dispositivo, así que se usará la voz del sistema. Para oír una buena pronunciación, añade una voz en español en los ajustes de idioma del dispositivo, o abre la página en Chrome, Edge o Safari.';
    return;
  }
  voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name; o.textContent = v.name.replace(/^(Microsoft|Google)\s*/, '') + ' (' + v.lang + ')';
    voiceSel.appendChild(o);
  });
  const savedVoice = load('barroco-voice');
  voice = voices.find(v => v.name === savedVoice) || voices[0];
  voiceSel.value = voice.name;
  statusEl.className = 'status';
  statusEl.textContent = `Voz lista: ${voices.length} ${voices.length === 1 ? 'voz' : 'voces'} en español. Si una voz suena poco natural, prueba otra en el menú “Voz”. Mantén la pantalla encendida mientras escuchas: en algunos móviles la voz se detiene al bloquear el teléfono.`;
}

if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
  playBtn.disabled = true;
  statusEl.className = 'status warn';
  statusEl.textContent = 'Este navegador no puede leer textos en voz alta. Abre la página en Chrome, Edge o Safari para escuchar la explicación. Mientras tanto, puedes leer el texto completo aquí abajo.';
} else {
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 600);
  setTimeout(() => { if (!voices.length && !synth.getVoices().length) { statusEl.textContent = 'Pulsa el botón rojo para empezar a escuchar.'; } }, 1500);
}
mark(false);
window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });
</script>
</body>
</html>
